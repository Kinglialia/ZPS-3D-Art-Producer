# Pipeline của Producer — nơi DUY NHẤT định nghĩa thứ tự bước, agent, model, gate, output bắt buộc, giới hạn chạy song song.
# Các bước chạy tuần tự theo thứ tự [[steps]] bên dưới. GĐ 4 bật cả 6 bước.
# gate: review (reviewer PASS → bước sau) | review_human (reviewer PASS → người duyệt) | checks_human (script pass → người duyệt)
# top_fix: loại TOP_FIX reviewer được dùng ở bước này; `need_evidence` dùng được ở mọi bước có reviewer.
# inputs: bước đã duyệt mà brief trỏ tới `final/` (mặc định: bước liền trước).
# review_inputs: bước trong inputs mà brief reviewer trỏ tới `final/` (mặc định: inputs).
# concept: file trong _approved/<id>/ bước cần đọc; {id} = mã asset (mặc định: mọi file bắt buộc). review_concept: của reviewer (mặc định: concept).
# regions: `region` của finding mới mở đầu bằng một trong các tên này, vd `back: mép mái`.
# outputs, lock: {id} = mã asset, {res} = texture_res của thẻ (mặc định 2048). lock: file duyệt bước khóa bằng sha256 vào status.json `locked` (D20.7).
# issues: bước trong inputs mà brief chép dòng ISSUES của report worker bản đã duyệt (D20.3).
# pilot: brief ghi PILOT: deliver/<pilot_asset>/ để tool so với pilot (D21.7, D22.10).
# script: bước không có agent; `P brief` in lệnh chạy script (scripts/<script>), script ghi report-script.md.
# acceptable: tên JSON trong final/review/{gates,checks}/ mà worker được khai ACCEPTED_FAIL khi fail (D31.3); JSON fail
#   khác trả thẳng về worker, không gọi reviewer. Gate cứng không bao giờ được: inputs, package, schema, qa_export_check, meshy,
#   counts.
# views_set: bước làm bộ view (D35). Thẻ `views: none` bỏ bước này; `final/<mặt>.png` và regions ngoài `views` của thẻ
#   không bắt buộc (back: back; full: back, left, right; full_top: thêm top; không ghi = full).
# counts_gate: `P ingest` so `counts` của thẻ với `final/part_graph.json` (scripts/check_counts.py, D30.6): mỗi khóa cần
#   một param cùng tên trong `fixed_params`, cùng giá trị. Ghi final/review/checks/counts.json trước khi đọc JSON fail;
#   counts.json là gate cứng.
# sheet: ảnh PNG của bước, theo thứ tự (glob tính từ vN/). `P brief` ghép thành vN/review/sheet.png (scripts/review_sheet.py,
#   D31.1); brief reviewer chỉ đưa sheet. Reviewer xin ảnh gốc hoặc crop có trên đĩa qua need_evidence: script tự lấy, không
#   giao worker, tối đa [review] served_evidence lần mỗi đợt feedback.
# no_views_concept: file concept thêm cho worker khi thẻ `views: none`; reviewer khi đó nhận đúng danh sách của worker.

[project]
name = "{{PROJECT}}"

[paths]
approved = "{{CONCEPTS}}/_approved"
art_direction = "{{CONCEPTS}}/art-direction"

[review]
max_fix_rounds = 3
resume_rounds = 2
reviewer_model = "opus"
served_evidence = 2

[limits]
blender = 2
codex_image = 2
meshy = 1

# Mỗi lần gọi `codex exec` của gen_image_codex.py (D30.20): timeout_s ≥ 300 giây; brief đưa vào GEN_ARGS là --timeout.
[codex]
timeout_s = 900

[[steps]]
id = "blockout"
agent = "step-blockout"
reviewer = "check-blockout"
model = "opus"
gate = "review_human"
uses = ["blender"]
top_fix = ["structure", "param"]
counts_gate = true
sheet = ["final/review/game_cam.png", "final/review/lineup.png", "final/review/foot_front_*.png", "final/review/renders/*.png"]
outputs = ["final/part_graph.json", "final/parts_lib.py", "final/assembled.glb", "final/sources.json", "final/blockout.md"]

[[steps]]
id = "views_front"
agent = "step-views"
reviewer = "check-views"
model = "opus"
gate = "review"
uses = ["blender", "codex_image"]
top_fix = ["regen"]
acceptable = ["measure.json"]
views_set = true
inputs = ["blockout"]
concept = ["concept_albedo.png", "asset-card.yaml", "{id}.material.md"]
outputs = ["final/front.png", "final/guides/views.json", "final/concept_colors.json", "final/bg_color.json",
           "final/report/report.json", "final/report/VIEWS.md"]

[[steps]]
id = "views_rest"
agent = "step-views"
reviewer = "check-views"
model = "opus"
gate = "review_human"
uses = ["codex_image"]
top_fix = ["regen", "regen_front", "note_exception", "note_texture"]
acceptable = ["measure.json"]
views_set = true
inputs = ["blockout", "views_front"]
concept = ["concept_albedo.png", "asset-card.yaml", "{id}.material.md"]
regions = ["back", "left", "right", "top"]
outputs = ["final/back.png", "final/left.png", "final/right.png", "final/top.png", "final/README.md",
           "final/report/report.json", "final/report/VIEWS.md", "final/report/VIEWS_sheet.png"]

[[steps]]
id = "model"
agent = "step-model"
reviewer = "check-clay"
model = "opus"
gate = "review_human"
uses = ["blender"]
top_fix = ["structure", "param"]
inputs = ["blockout", "views_front", "views_rest"]
review_inputs = ["blockout"]
concept = ["concept_albedo.png", "concept_shadow.png", "asset-card.yaml"]
pilot = true
acceptable = ["qa_screen_tris_check.json"]
counts_gate = true
sheet = ["final/review/lit_*.png", "final/review/clay_lit_concept.png", "final/review/wire_34.png", "final/review/thumb.png",
         "final/review/lineup.png", "final/review/renders/*.png"]
lock = "final/{id}-untextured.glb"
outputs = ["final/{id}-untextured.glb", "final/{id}.blend", "final/part_graph.json", "final/parts_lib.py",
           "final/spec.json", "final/model.md", "final/review/model_sheet.png", "final/review/renders/renders.json"]

[[steps]]
id = "texture"
agent = "step-texture"
reviewer = "check-texture"
model = "opus"
gate = "review"
uses = ["blender", "codex_image", "meshy"]
top_fix = ["repaint", "fix_uv_mesh", "meshy_regen", "note"]
inputs = ["blockout", "views_front", "views_rest", "model"]
review_inputs = ["views_rest"]
concept = ["concept_albedo.png", "concept_shadow.png", "asset-card.yaml"]
review_concept = ["concept_albedo.png", "concept_shadow.png"]
no_views_concept = ["{id}.material.md"]
sheet = ["final/final_lit_vs_concept.png", "final/review/lit_*.png", "final/review/unlit_*.png", "final/review/thumb.png",
         "final/review/id_map.png", "final/review/meshy_albedo.png", "final/albedo_*.png"]
issues = ["model"]
pilot = true
outputs = ["final/albedo_{res}.png", "final/texture_spec.json", "final/notes.md", "final/final_lit_vs_concept.png",
           "final/review/renders.json", "final/review/checks/tex_measure.json"]

[[steps]]
id = "assemble"
gate = "checks_human"
script = "assemble.py"
uses = ["blender"]
inputs = ["model", "texture"]
outputs = ["final/README.md", "final/model/{id}.glb", "final/model/{id}.blend", "final/texture/albedo_{res}.png",
           "final/texture/notes.md", "final/review/compare.json"]
