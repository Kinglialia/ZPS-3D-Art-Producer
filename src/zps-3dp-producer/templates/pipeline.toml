# Pipeline của Producer — nơi DUY NHẤT định nghĩa thứ tự bước, agent, model, gate, output bắt buộc, giới hạn chạy song song.
# Các bước chạy tuần tự theo thứ tự [[steps]] bên dưới. GĐ 4 bật cả 5 bước.
# gate: review (reviewer PASS → bước sau) | review_human (reviewer PASS → người duyệt) | checks_human (script pass → người duyệt)
# model: model của worker. escalate_model: model của worker mới khi vòng sửa vượt [review] resume_rounds (không ghi =
#   model). reviewer_model: model của reviewer bước này (không ghi = [review] reviewer_model). Giá trị: opus | sonnet |
#   haiku; runtime đổi sang model thật. Hạ model của một bước chỉ sau khi pilot đo được số vòng sửa (D45).
# top_fix: loại TOP_FIX reviewer được dùng ở bước này; `need_evidence` dùng được ở mọi bước có reviewer.
# inputs: bước đã duyệt mà brief trỏ tới `final/` (mặc định: bước liền trước).
# review_inputs: bước trong inputs mà brief reviewer trỏ tới `final/` (mặc định: inputs).
# concept: file trong _approved/<id>/ bước cần đọc; {id} = mã asset (mặc định: mọi file bắt buộc). review_concept: của reviewer (mặc định: concept).
# regions: `region` của finding mới mở đầu bằng một trong các tên này, vd `back: mép mái`.
# outputs, lock: {id} = mã asset, {res} = texture_res của thẻ (mặc định 2048). outputs gồm cả JSON kết quả mà một lần chạy
#   đúng của bước luôn ghi: thiếu một file thì ingest dừng, nêu tên file. Không ghi JSON chỉ có ở một chế độ hay một
#   vòng: meshy.json (một chế độ), inputs.json của views và model (vòng sửa của hai bước này không chạy lại). Bước thiếu một
#   JSON kết quả mà bước cùng id của template này có: mọi lệnh dừng, nêu bước. lock: file duyệt bước khóa bằng sha256 vào status.json `locked` (D20.7).
# issues: bước trong inputs mà brief chép dòng ISSUES của report worker bản đã duyệt (D20.3).
# pilot: brief ghi PILOT: deliver/<pilot_asset>/ để tool so với pilot (D21.7, D22.10).
# script: bước không có agent; `P brief` in lệnh chạy script (scripts/<script>), script ghi report-script.md.
# acceptable: tên JSON trong final/review/{checks,gates}/ mà worker được khai ACCEPTED_FAIL khi fail (D31.3); JSON fail
#   khác trả thẳng về worker, không gọi reviewer. Tên thường (`proportion.json`) khớp file ngoài `gates/`. `<glob>#<check>[,<check>]`
#   (`gates/*.json#gate5.health`) khớp file theo đường dẫn từ `final/review/` khi mọi check đang fail của file nằm trong danh
#   sách: một part có gate khác fail thì không khai được. Gate cứng không bao giờ được: inputs, package, schema,
#   qa_export_check, meshy, counts.
# views_set: bước làm bộ view (D35). Thẻ `views: none` bỏ bước này; `final/<mặt>.png`, regions và ảnh sheet của mặt ngoài
#   `views` của thẻ không bắt buộc (back: back; full: back, left, right; full_top: thêm top; không ghi = full).
# counts_gate: `P ingest` so `counts` của thẻ với `final/part_graph.json` (scripts/check_counts.py, D30.6): mỗi khóa cần
#   một param cùng tên trong `fixed_params`, cùng giá trị, hoặc đúng số đó part có `tag: <khóa>`. Ghi
#   final/review/checks/counts.json trước khi đọc JSON fail; counts.json là gate cứng.
# sheet: ảnh PNG của bước, theo thứ tự (glob tính từ vN/). `P brief` ghép thành vN/review/sheet.png (scripts/review_sheet.py,
#   D31.1, D38.5): mỗi trang tối đa 8 ô; nhiều hơn thì thêm sheet-2.png, sheet-3.png, và sheet.json ghi trang và hộp của từng
#   nhãn. `native:<glob>` đặt ảnh đúng cỡ thật (ảnh lớn hơn ô bị cắt, không thu nhỏ); `crop:<glob>` thêm một ô là vùng 1:1
#   quanh giữa phần có vẽ của ảnh. Brief reviewer đưa sheet; reviewer xin ảnh gốc hoặc crop có trên đĩa qua need_evidence:
#   script tự lấy, không giao worker, tối đa [review] served_evidence lần mỗi đợt feedback.
# no_views_concept: file concept thêm cho worker khi thẻ `views: none`; reviewer khi đó nhận đúng danh sách của worker.
# fix_copy_exclude: mẫu đường dẫn (tính từ final/, `*` khớp cả dấu `/`). `P brief` của vòng sửa chép final/ của bản gốc sang
#   final/ mới, trừ các đường dẫn khớp một mẫu: file bước làm lại ghi lại, chép sang sẽ thành bản cũ. Không ghi = không chép;
#   bước có khóa này trong template thì bắt buộc (worker không tự chép final/), thiếu thì mọi lệnh dừng.
# codex_batch: true → GEN_ARGS có --batch: các paint view dùng chung tham chiếu gen trong một lần gọi Codex, rồi kiểm từng
#   file (D30.22). Mặc định false. Chỉ bật ở bước texture; bật thử ở V6 và so số finding repaint với gọi từng ảnh.

[project]
name = "{{PROJECT}}"

[paths]
approved = "{{CONCEPTS}}/_approved"
art_direction = "{{CONCEPTS}}/art-direction"

[review]
max_fix_rounds = 3
max_direct_rounds = 2
resume_rounds = 2
reviewer_model = "opus"
served_evidence = 2

[limits]
blender = 2
codex_image = 2
meshy = 1

# Mỗi lần gọi `codex exec` của gen_image_codex.py (D30.20): timeout_s ≥ 300 giây; brief đưa vào GEN_ARGS là --timeout.
[codex]
timeout_s = 900

# usual_min (D33.10, D39.3): phút thường lệ của một lần giao khi `P stats` chưa có số của bước. Hạn chót = số này (hoặc
# trung vị các lần trước, tính riêng lần dựng đầu và vòng sửa) × watch.deadline_factor của policy.yaml. Hạn chót chỉ
# để báo trễ, không phải kẹt. Số đo: texture worker 16 = cả bước texture (nguồn: Run 5, 1 asset, Meshy SỬA, 15m32s cho
# 2 version, gồm worker và reviewer), nên một lần giao worker không dài hơn; Run 4 VẼ MỚI 38m25s cho 4 version. Tạm, đo
# lại sau 3–5 asset khác loại. Các số khác chưa đo; views = tổng hai bước view của v0.7.1.
[[steps]]
id = "blockout"
usual_min = { worker = 40, reviewer = 10 }
agent = "step-blockout"
reviewer = "check-blockout"
model = "opus"
reviewer_model = "opus"
gate = "review_human"
uses = ["blender"]
top_fix = ["structure", "param"]
counts_gate = true
acceptable = ["proportion.json", "base.json", "gates/*.json#gate5.health"]
sheet = ["final/review/game_cam.png", "final/review/renders/clay_*.png", "final/review/renders/parts_*.png",
         "final/review/renders/overlay_*.png", "final/review/foot_front_*.png", "final/review/mat_*.png"]
outputs = ["final/part_graph.json", "final/parts_lib.py", "final/assembled.glb", "final/sources.json", "final/blockout.md",
           "final/review/checks/inputs.json", "final/review/checks/schema.json", "final/review/checks/materials.json",
           "final/review/checks/layout.json", "final/review/checks/base.json", "final/review/checks/markers.json",
           "final/review/checks/support.json", "final/review/checks/proportion.json"]

[[steps]]
id = "views"
usual_min = { worker = 70, reviewer = 20 }
agent = "step-views"
reviewer = "check-views"
model = "opus"
escalate_model = "opus"
reviewer_model = "opus"
gate = "review_human"
uses = ["blender", "codex_image"]
top_fix = ["regen", "note_exception", "note_texture"]
acceptable = ["measure.json"]
views_set = true
inputs = ["blockout"]
concept = ["concept_albedo.png", "asset-card.yaml", "{id}.material.md"]
regions = ["front", "back", "left", "right", "top"]
sheet = ["final/front.png", "final/guides/front_guide.png", "final/report/overlay_front.png",
         "final/back.png", "final/guides/back_guide.png", "final/report/overlay_back.png",
         "final/left.png", "final/guides/left_guide.png", "final/report/overlay_left.png",
         "final/right.png", "final/guides/right_guide.png", "final/report/overlay_right.png",
         "final/top.png", "final/guides/top_guide.png", "final/report/overlay_top.png"]
outputs = ["final/front.png", "final/back.png", "final/left.png", "final/right.png", "final/top.png",
           "final/guides/views.json", "final/bg_color.json", "final/README.md", "final/report/report.json",
           "final/report/VIEWS.md", "final/report/VIEWS_sheet.png", "final/review/checks/measure.json",
           "final/review/checks/package.json"]

[[steps]]
id = "model"
usual_min = { worker = 60, reviewer = 15 }
agent = "step-model"
reviewer = "check-clay"
model = "opus"
reviewer_model = "opus"
gate = "review_human"
uses = ["blender"]
top_fix = ["structure", "param"]
inputs = ["blockout", "views"]
review_inputs = ["blockout"]
concept = ["concept_albedo.png", "concept_shadow.png", "asset-card.yaml"]
pilot = true
acceptable = ["qa_screen_tris_check.json"]
counts_gate = true
sheet = ["final/review/lit_*.png", "final/review/clay_lit_concept.png", "final/review/renders/clay_34.png",
         "final/review/renders/clay_front.png", "final/review/renders/parts_34.png", "final/review/wire_34.png",
         "crop:final/review/wire_34.png", "native:final/review/thumb.png", "final/review/uv_checker.png",
         "final/review/renders/overlay_*.png"]
lock = "final/{id}-untextured.glb"
outputs = ["final/{id}-untextured.glb", "final/{id}.blend", "final/part_graph.json", "final/parts_lib.py",
           "final/spec.json", "final/model.md", "final/review/model_sheet.png", "final/review/renders/renders.json",
           "final/review/join.json", "final/review/unwrap.json", "final/review/checks/detail.json",
           "final/review/checks/mesh.json", "final/review/checks/uv_edge.json", "final/review/checks/qa_mesh_check.json",
           "final/review/checks/qa_uv_check.json", "final/review/checks/qa_export_check.json",
           "final/review/checks/qa_screen_tris_check.json"]

[[steps]]
id = "texture"
usual_min = { worker = 16, reviewer = 15 }
agent = "step-texture"
reviewer = "check-texture"
model = "opus"
reviewer_model = "opus"
gate = "review"
uses = ["blender", "codex_image", "meshy"]
top_fix = ["repaint", "fix_uv_mesh", "meshy_regen", "note"]
inputs = ["blockout", "views", "model"]
review_inputs = ["views"]
concept = ["concept_albedo.png", "concept_shadow.png", "asset-card.yaml"]
review_concept = ["concept_albedo.png", "concept_shadow.png"]
no_views_concept = ["{id}.material.md"]
sheet = ["final/final_lit_vs_concept.png", "final/review/lit_*.png", "native:final/review/thumb.png",
         "final/review/id_map.png", "final/review/meshy_albedo.png", "crop:final/review/lit_close_front.png"]
issues = ["model"]
codex_batch = false
fix_copy_exclude = ["review/lit_*", "review/unlit_*", "review/thumb.png", "review/renders.json", "review/render_texture.json",
                    "review/checks/tex_measure.json", "review/checks/render_fresh.json", "final_lit_vs_concept.png"]
pilot = true
outputs = ["final/albedo_{res}.png", "final/texture_spec.json", "final/notes.md", "final/final_lit_vs_concept.png",
           "final/review/renders.json", "final/review/checks/inputs.json", "final/review/checks/tex_measure.json"]

[[steps]]
id = "assemble"
gate = "checks_human"
script = "assemble.py"
uses = ["blender"]
inputs = ["model", "texture"]
outputs = ["final/README.md", "final/model/{id}.glb", "final/model/{id}.blend", "final/texture/albedo_{res}.png",
           "final/texture/notes.md", "final/review/compare.json"]
