# D30.6: khóa `counts` của thẻ asset → `<hàm custom>.<tham số đếm>` trong part graph, theo `type` của thẻ.
# Gate (blockout, model): mọi part gọi hàm đó truyền vào tham số này tên một param có trong `fixed_params`,
# và param đó bằng số của thẻ. Không part nào gọi hàm đó → fail.
# Khóa của thẻ không có ở đây: `check_card.py` cảnh báo, gate không so (ghi not_checked).
# Chưa ánh xạ được (không hàm nào trong custom_lib.FUNCTIONS có tham số đếm):
#   body_board_rows: grooved_box luôn có 2 rãnh (z1, z2) = 3 hàng; doors, windows, pillars, steps: là số part.
building: {}
prop:
  lid_board_rows: plank_vault.planks
